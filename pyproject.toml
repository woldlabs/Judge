[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-framework"
version = "0.1.0"
description = "Multimodal anomaly detection framework for unconventional phenomena in video, audio, and sensor data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "woldlabs", email = "contact@woldlabs.dev"}
]
keywords = [
  "anomaly-detection",
  "multimodal-analysis",
  "signal-processing",
  "uap",
  "phenomena",
  "time-series",
  "video-analysis",
  "audio-analysis",
  "forensics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "Pillow>=10.0",
  "customtkinter>=5.2",
  "reportlab>=4.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
  "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/woldlabs/Judge"
Repository = "https://github.com/woldlabs/Judge"
Issues = "https://github.com/woldlabs/Judge/issues"

[project.scripts]
judge = "judge.gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["judge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
