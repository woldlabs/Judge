name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q

  hold-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HOLD banner + 1.x.x grep (Judge #14 hygiene)
        run: |
          test -f README.md
          grep -q "HOLD (pre-1.x.x)" README.md
          grep -q "1.x.x" README.md
          grep -q "HOLD" README.md
          echo "ok: HOLD banner + 1.x.x present"

