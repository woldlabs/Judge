name: Staging QA repro
description: Staging-only QA repro for Judge — staging only, never production
title: "[staging-qa]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Staging only — never production.**

        Use this form for Judge **staging/lab** QA repros only. Judge is a local desktop + headless CLI analyzer (not a hosted production service). Do not file production incidents or production environment details here.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Staging/lab identifier only (not production). Judge is local/desktop — e.g. machine name, venv path, lab host, or a GitHub Actions run. Do not use a production URL.
      placeholder: e.g. local venv on lab-pc / GitHub Actions run / judge-staging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps on staging.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual
      description: What you expected on staging, and what actually happened.
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Actions URL
      description: Paste relevant logs or link a GitHub Actions run URL.
      placeholder: https://github.com/woldlabs/Judge/actions/runs/...
    validations:
      required: false
  - type: input
    id: browser-client
    attributes:
      label: Browser / client (optional)
      description: Browser, OS, or client used when reproducing on staging.
      placeholder: e.g. Chrome 128 / macOS / CLI
    validations:
      required: false
